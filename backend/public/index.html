<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamHub - Media Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0c0d12; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

  <!-- Minimal Top Header -->
  <header class="border-b border-zinc-800/80 bg-[#0c0d12]/90 backdrop-blur sticky top-0 z-40 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-7 h-7 rounded-md bg-white text-black flex items-center justify-center font-bold text-xs">
        <i class="fa-solid fa-play text-[10px]"></i>
      </div>
      <div>
        <h1 class="font-semibold text-sm tracking-tight text-white leading-none">StreamHub</h1>
        <p class="text-[10px] text-zinc-500 mt-0.5">Local Media</p>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <a href="/admin" class="text-xs text-zinc-400 hover:text-white transition px-2.5 py-1.5 rounded-md hover:bg-zinc-800/50 flex items-center gap-1.5 border border-zinc-800">
        <i class="fa-solid fa-lock text-[11px] text-zinc-400"></i> Admin
      </a>
      <button id="disconnectBtn" onclick="handleDisconnect()" class="hidden text-xs text-zinc-400 hover:text-rose-400 transition px-2.5 py-1.5 rounded-md hover:bg-zinc-800/50 border border-zinc-800">
        Disconnect
      </button>
    </div>
  </header>

  <!-- SCREEN 1: MINIMAL DEVICE PAIRING (Shown when not admitted) -->
  <main id="pairingScreen" class="flex-1 flex items-center justify-center p-6">
    <div class="max-w-sm w-full text-center space-y-5 bg-[#121318] border border-zinc-800 p-8 rounded-2xl shadow-xl">
      <div class="w-12 h-12 rounded-xl bg-zinc-800/60 text-zinc-300 flex items-center justify-center mx-auto text-xl border border-zinc-700/50">
        <i class="fa-solid fa-tv"></i>
      </div>
      
      <div>
        <h2 class="text-lg font-semibold text-white">Device Access</h2>
        <p class="text-xs text-zinc-400 mt-1">Connect this screen to stream media from the host server.</p>
      </div>

      <div id="initialConnectBox">
        <button onclick="requestPairingCode()" class="w-full py-2.5 bg-white hover:bg-zinc-200 text-black font-semibold rounded-lg text-xs transition shadow-sm">
          Connect This Device
        </button>
      </div>

      <div id="waitingApprovalBox" class="hidden space-y-3">
        <p class="text-[11px] text-zinc-500 uppercase tracking-wider">Pairing Code</p>
        <div id="displayPairCode" class="text-3xl font-mono tracking-widest text-white font-bold bg-[#0c0d12] py-3.5 px-4 rounded-lg border border-zinc-800">
          --- ---
        </div>
        <p class="text-xs text-zinc-400 flex items-center justify-center gap-2 pt-1">
          <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span>
          Waiting for host approval in Admin Panel...
        </p>
      </div>
    </div>
  </main>

  <!-- SCREEN 2: AUTHORIZED MEDIA LIBRARY (Shown once admitted) -->
  <main id="mediaLibraryScreen" class="hidden flex-1 max-w-6xl w-full mx-auto px-6 py-8 space-y-6">
    <!-- Filter Tabs & Refresh -->
    <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
      <div class="flex items-center space-x-1.5">
        <button onclick="filterMedia('all')" class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-800 text-white transition" data-type="all">All</button>
        <button onclick="filterMedia('video')" class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition" data-type="video">Videos</button>
        <button onclick="filterMedia('audio')" class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition" data-type="audio">Music</button>
        <button onclick="filterMedia('image')" class="tab-btn px-3 py-1.5 rounded-md text-xs font-medium text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition" data-type="image">Photos</button>
      </div>
      <button onclick="loadMediaCatalog()" class="text-xs text-zinc-400 hover:text-white px-2.5 py-1.5 rounded-md border border-zinc-800 hover:bg-zinc-800/50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-rotate text-[10px]"></i> Refresh
      </button>
    </div>

    <!-- Media Cards Grid -->
    <div id="userMediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <!-- Media rendered here dynamically -->
    </div>
  </main>

  <!-- VIDEO MODAL PLAYER -->
  <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-4">
    <div class="max-w-4xl w-full space-y-3">
      <div class="flex items-center justify-between text-zinc-300 px-1">
        <h3 id="videoModalTitle" class="font-medium text-sm truncate text-zinc-200"></h3>
        <button onclick="closeVideoModal()" class="w-7 h-7 rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
      <div class="rounded-xl overflow-hidden bg-black border border-zinc-800 aspect-video flex items-center justify-center shadow-2xl">
        <video id="mainVideoPlayer" controls controlsList="nodownload" class="w-full h-full object-contain"></video>
      </div>
    </div>
  </div>

  <!-- STICKY BOTTOM AUDIO PLAYER -->
  <div id="audioBar" class="fixed bottom-0 inset-x-0 bg-[#121318] border-t border-zinc-800 p-3 hidden z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 min-w-[180px]">
        <div class="w-8 h-8 rounded-md bg-zinc-800 text-zinc-300 flex items-center justify-center text-sm border border-zinc-700">
          <i class="fa-solid fa-music text-xs"></i>
        </div>
        <div class="truncate">
          <div id="audioBarTitle" class="text-xs font-medium truncate text-zinc-200">Track Title</div>
          <div class="text-[10px] text-zinc-500">Audio Stream</div>
        </div>
      </div>
      <audio id="mainAudioPlayer" controls controlsList="nodownload" class="w-full max-w-md h-8"></audio>
      <button onclick="closeAudioBar()" class="text-zinc-500 hover:text-zinc-300 p-1.5">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Minimal Footer -->
  <footer class="border-t border-zinc-900 py-4 text-center text-[11px] text-zinc-600">
    Local Stream Media Hub
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let deviceToken = localStorage.getItem('MEDIA_DEVICE_TOKEN');
    let currentFilter = 'all';
    let allMediaItems = [];

    // Check device token on load (or query auto-token)
    async function initClient() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryToken = urlParams.get('token') || urlParams.get('autoToken');
      if (queryToken) {
        localStorage.setItem('MEDIA_DEVICE_TOKEN', queryToken);
        deviceToken = queryToken;
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      if (deviceToken) {
        try {
          const res = await fetch('/api/v1/auth/verify-device', {
            headers: { 'x-device-token': deviceToken }
          });
          const data = await res.json();
          if (data.authorized) {
            showMediaLibrary();
            return;
          }
        } catch (e) {}
      }
      showPairingScreen();
    }

    function showPairingScreen() {
      document.getElementById('pairingScreen').classList.remove('hidden');
      document.getElementById('mediaLibraryScreen').classList.add('hidden');
      document.getElementById('disconnectBtn').classList.add('hidden');
    }

    function showMediaLibrary() {
      document.getElementById('pairingScreen').classList.add('hidden');
      document.getElementById('mediaLibraryScreen').classList.remove('hidden');
      document.getElementById('disconnectBtn').classList.remove('hidden');
      loadMediaCatalog();
    }

    function handleDisconnect() {
      localStorage.removeItem('MEDIA_DEVICE_TOKEN');
      deviceToken = null;
      location.reload();
    }

    async function requestPairingCode() {
      document.getElementById('initialConnectBox').classList.add('hidden');
      document.getElementById('waitingApprovalBox').classList.remove('hidden');

      const res = await fetch('/api/v1/auth/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceName: navigator.userAgent })
      });
      const data = await res.json();
      const code = data.pairingCode;

      document.getElementById('displayPairCode').innerText = code;

      // Join socket room to await instant authorization
      socket.emit('JOIN_PAIRING_ROOM', `pair_${code}`);

      let pollInterval = null;

      function onApproved(accessToken) {
        if (!accessToken) return;
        if (pollInterval) clearInterval(pollInterval);
        localStorage.setItem('MEDIA_DEVICE_TOKEN', accessToken);
        deviceToken = accessToken;
        showMediaLibrary();
      }

      socket.off('PAIRING_APPROVED');
      socket.on('PAIRING_APPROVED', ({ deviceAccessToken }) => {
        onApproved(deviceAccessToken);
      });

      // Polling fallback every 2s (ensures mobile/Ethernet devices connect even if socket disconnects)
      pollInterval = setInterval(async () => {
        try {
          const pollRes = await fetch(`/api/v1/auth/pairing-status/${encodeURIComponent(code)}`);
          const pollData = await pollRes.json();
          if (pollData.success && pollData.status === 'APPROVED' && pollData.deviceAccessToken) {
            onApproved(pollData.deviceAccessToken);
          }
        } catch (e) {}
      }, 2000);
    }

    async function loadMediaCatalog() {
      try {
        const res = await fetch('/api/v1/media', {
          headers: { 'x-device-token': deviceToken }
        });
        const data = await res.json();
        allMediaItems = data.data || [];
        renderMediaItems();
      } catch (e) {
        console.error(e);
      }
    }

    function filterMedia(type) {
      currentFilter = type;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = 'tab-btn px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-800 text-white transition';
        } else {
          btn.className = 'tab-btn px-3 py-1.5 rounded-md text-xs font-medium text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition';
        }
      });
      renderMediaItems();
    }

    function renderMediaItems() {
      const grid = document.getElementById('userMediaGrid');
      const filtered = currentFilter === 'all' 
        ? allMediaItems 
        : allMediaItems.filter(m => m.mediaType === currentFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-zinc-600 text-xs">No media available in this category.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(m => {
        let actionIcon = 'fa-play';
        if (m.mediaType === 'audio') actionIcon = 'fa-music';
        if (m.mediaType === 'image') actionIcon = 'fa-expand';

        return `
          <div onclick="playMedia('${m._id}', '${m.mediaType}', '${escape(m.title)}', '${m.secureUrl}')" class="bg-[#121318] border border-zinc-850 hover:border-zinc-700 rounded-xl overflow-hidden transition cursor-pointer group flex flex-col justify-between">
            <div class="h-32 bg-[#0a0b0e] relative overflow-hidden flex items-center justify-center">
              ${m.thumbnailUrl ? `<img src="${m.thumbnailUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">` : `<i class="fa-solid fa-film text-2xl text-zinc-700"></i>`}
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                <div class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center shadow">
                  <i class="fa-solid ${actionIcon} text-xs"></i>
                </div>
              </div>
              <span class="absolute top-2 right-2 px-1.5 py-0.5 rounded text-[9px] font-medium uppercase bg-black/70 text-zinc-400 border border-zinc-800">
                ${m.mediaType}
              </span>
            </div>
            <div class="p-3">
              <h3 class="font-medium text-xs text-zinc-200 truncate">${m.title}</h3>
              <p class="text-[10px] text-zinc-500 mt-0.5 capitalize">${m.storageProvider || 'Cloud'}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function playMedia(id, type, escapedTitle, secureUrl) {
      const title = unescape(escapedTitle);
      const streamUrl = `/api/v1/media/stream/${id}?deviceToken=${deviceToken}`;

      if (type === 'video') {
        const modal = document.getElementById('videoModal');
        const video = document.getElementById('mainVideoPlayer');
        document.getElementById('videoModalTitle').innerText = title;
        video.src = streamUrl;
        modal.classList.remove('hidden');
        video.play();
      } else if (type === 'audio') {
        const bar = document.getElementById('audioBar');
        const audio = document.getElementById('mainAudioPlayer');
        document.getElementById('audioBarTitle').innerText = title;
        audio.src = streamUrl;
        bar.classList.remove('hidden');
        audio.play();
      } else if (type === 'image') {
        window.open(secureUrl, '_blank');
      }
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('mainVideoPlayer');
      video.pause();
      video.src = '';
      modal.classList.add('hidden');
    }

    function closeAudioBar() {
      const bar = document.getElementById('audioBar');
      const audio = document.getElementById('mainAudioPlayer');
      audio.pause();
      audio.src = '';
      bar.classList.add('hidden');
    }

    initClient();
  </script>
</body>
</html>
